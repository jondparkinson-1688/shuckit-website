<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="apple-touch-icon" href="/assets/favicon.png">
<title>Shuck it: find your next seafood shack</title>
<meta name="description" content="Shuck it is the app for finding seafood shacks worth the trip, rated by people who've actually been, so you never waste a day out on a dud.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/legal.css">
<style>
  /* Figma "Shuck it" styles */
  :root {
    --black: #1E1E1E;
    --yellow: #FFD801;
    --white: #FFFFFF;
    --background-grey: #F2F0EB;
    --gap: 16px;
    --pad: 40px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    /* What the footer sits on, revealed as the black section scrolls away. */
    background: var(--background-grey);
    color: var(--black);
    font-family: "DM Sans", -apple-system, BlinkMacSystemFont, sans-serif;
    font-weight: 500;
    font-size: 17px;
    line-height: 1.2;
    letter-spacing: -0.01em;
    font-variation-settings: "opsz" 14;
  }
  a { color: inherit; }

  /* The black section: full height, above the footer. */
  main {
    position: relative;
    z-index: 1;
    display: flex;
    gap: var(--gap);
    padding: var(--gap);
    min-height: 100vh;
    min-height: 100svh;
    background: var(--black);
  }
  .panel { flex: 1 1 0; min-width: 0; padding: var(--pad); }

  /* Left: yellow, logo and blurb at the top, headline, button at the bottom. */
  .intro {
    container-type: inline-size;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 48px;
    background: var(--yellow);
  }
  .top { display: flex; gap: var(--gap); align-items: flex-start; }
  .top > * { flex: 1 1 0; min-width: 0; }
  .logo { display: block; width: 166px; max-width: 100%; height: auto; }
  /* A narrow yellow panel (mid-size windows, phones): logo above the blurb,
     so they never overlap. */
  @container (max-width: 440px) {
    .top { flex-direction: column; gap: 24px; }
  }
  .blurb { margin: 0; }
  h1 {
    margin: 0;
    font-weight: 500;
    font-size: clamp(48px, 6.3vw, 96px);
    line-height: 1.1;
    letter-spacing: -0.02em;
  }
  .button {
    display: inline-block;
    align-self: flex-start;
    padding: 20px 28px;
    border-radius: 1000px;
    background: var(--black);
    color: var(--white);
    font-weight: 600;
    text-decoration: none;
  }

  /* Right: the nets photo with the app on a phone. */
  .visual {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--black) url("assets/nets.jpg") center / cover no-repeat;
  }
  /* The whole app screen inside a 10px black frame. Sized by its width, so
     the frame always has the screen's exact shape (860 × 1864) and shrinks
     in height with it: never wider than the panel, never taller than the
     window, and at most 680px tall, as in Figma. */
  .phone {
    --tallest: min(680px, calc(100svh - 2 * var(--gap) - 2 * var(--pad) - 20px));
    display: block;
    box-sizing: content-box;
    width: min(calc(100% - 20px), calc(var(--tallest) * 860 / 1864));
    height: auto;
    border: 10px solid var(--black);
    border-radius: 42px;
  }

  /* The footer waits underneath; scrolling past the black section reveals it. */
  footer {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 0;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 16px 32px;
    padding: var(--pad);
  }
  footer > span { color: rgba(30, 30, 30, 0.5); } /* Black 50 (Figma 2091:2330) */
  footer nav { display: flex; gap: 32px; font-weight: 600; }
  footer nav a { text-decoration: none; }
  footer nav a:hover { opacity: 0.8; }

  /* Phones: the two panels stack, each the height of the screen (Jon). */
  @media (max-width: 800px) {
    :root { --pad: 24px; }
    main { flex-direction: column; min-height: 0; }
    .intro, .visual { flex: none; min-height: calc(100svh - 2 * var(--gap)); }
    .phone { --tallest: min(600px, calc(100svh - 2 * var(--gap) - 2 * var(--pad) - 20px)); }
  }

  /* Terms and Privacy Policy: a centred card over a dimmed page (Figma
     2091:2037), 16 from the window's edges, the same width as a panel. */
  .legal-dialog {
    width: min(740px, calc(100% - 32px));
    height: calc(100svh - 32px);
    max-width: none;
    max-height: none;
    margin: auto;
    padding: 0;
    border: 0;
    background: none;
    overflow: visible;
  }
  .legal-dialog::backdrop { background: rgba(30, 30, 30, 0.75); }
  .legal-dialog:focus, .legal-dialog .legal:focus { outline: none; }
  .legal-dialog .legal { height: 100%; }
  html:has(.legal-dialog[open]) { overflow: hidden; }
  @media (max-width: 600px) {
    .legal-dialog { width: calc(100% - 16px); height: calc(100svh - 16px); }
  }
</style>
</head>
<body>
<main>
  <section class="panel intro">
    <div class="top">
      <div><img class="logo" src="assets/logo.svg" alt="Shuck it" width="166" height="34"></div>
      <p class="blurb">Shuck it is the app for finding seafood shacks worth the trip, rated by people who’ve actually been, so you never waste a day out on a dud.</p>
    </div>
    <h1>Find your next seafood shack</h1>
    <!-- Becomes "Get the app", linking to the App Store, at launch. -->
    <span class="button">Coming soon</span>
  </section>
  <section class="panel visual" aria-label="The Shuck it app">
    <img class="phone" src="assets/app-screen.jpg" alt="A seafood shack open in the Shuck it app, with its rating and distance" width="323" height="700">
  </section>
</main>
<footer>
  <span>Made with ❤️ by the sea</span>
  <nav aria-label="Legal">
    <a href="/legal#privacy">Privacy</a>
    <a href="/legal#terms">Terms</a>
    <a href="/legal#support">Support</a>
  </nav>
</footer>
<dialog class="legal-dialog" aria-labelledby="legal-title"></dialog>
<script>
  // Leave room at the bottom of the page for the footer underneath.
  const footer = document.querySelector("footer");
  const fit = () => { document.body.style.paddingBottom = footer.offsetHeight + "px"; };
  new ResizeObserver(fit).observe(footer);
  fit();

  // Privacy, Terms and Support open the Terms and Privacy Policy card here.
  // Its wording is read from the /legal page, so there's only one copy.
  // Without JavaScript, or if loading fails, the links simply go to /legal.
  const dialog = document.querySelector(".legal-dialog");
  let loaded = null;
  async function loadLegal() {
    const html = await (await fetch("/legal/")).text();
    const legal = new DOMParser().parseFromString(html, "text/html").querySelector("#legal");
    if (!legal) throw new Error("No legal content");
    // X closes the card instead of going to the home page.
    const link = legal.querySelector(".close");
    const close = document.createElement("button");
    close.className = "close"; close.type = "button"; close.setAttribute("aria-label", "Close");
    close.innerHTML = link.innerHTML;
    link.replaceWith(close);
    dialog.append(document.importNode(legal, true));
    dialog.querySelector(".close").addEventListener("click", () => dialog.close());
    // Jump buttons scroll the card, not the page.
    dialog.querySelectorAll('.legal-jumps a').forEach(a => a.addEventListener("click", e => {
      e.preventDefault();
      dialog.querySelector(a.getAttribute("href")).scrollIntoView({ behavior: "smooth", block: "start" });
    }));
  }
  document.querySelectorAll('footer nav a').forEach(a => a.addEventListener("click", async e => {
    e.preventDefault();
    try {
      loaded = loaded || loadLegal();
      await loaded;
    } catch {
      loaded = null;
      location.href = a.href;
      return;
    }
    dialog.showModal();
    const section = dialog.querySelector(new URL(a.href).hash);
    const card = dialog.querySelector(".legal");
    if (a.hash === "#privacy") card.scrollTop = 0; else section.scrollIntoView({ block: "start" });
  }));
  // A click on the dimmed page (outside the card) closes it; Escape does too.
  dialog.addEventListener("click", e => { if (e.target === dialog) dialog.close(); });
</script>
</body>
</html>
